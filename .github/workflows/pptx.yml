name: PowerPoint copy

# Rebuilds the PowerPoint files from main and attaches them to the "pptx-latest" release,
# so the download links in the README always give the current deck.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pptx
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Playwright's own image already holds Chromium and its system libraries, so nothing is installed with apt.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v5

      - name: Install Playwright and python-pptx
        run: python3 -m pip install --break-system-packages playwright==1.62.0 python-pptx==1.0.2

      - name: Export the deck to PowerPoint
        run: python3 tools/export_pptx.py

      - uses: actions/upload-artifact@v4
        with:
          name: pptx
          path: export/*.pptx
          if-no-files-found: error

  release:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pptx
          path: export

      - name: Attach the files to the pptx-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view pptx-latest >/dev/null 2>&1 || \
            gh release create pptx-latest --title "PowerPoint copy of the deck" --notes "Rebuilt from main after every change." --latest=false --target "$GITHUB_SHA"
          gh release upload pptx-latest export/UCLuster-Too-qualifier.pptx export/UCLuster-Too-qualifier-pictures.pptx --clobber
          gh release edit pptx-latest --notes "Rebuilt from main at commit ${GITHUB_SHA::7} on $(date -u '+%d %b %Y, %H:%M') UTC.

          - UCLuster-Too-qualifier.pptx rebuilds each slide from PowerPoint shapes and text boxes, with no pictures. Install Google Sans Flex and Google Sans Code for an exact match.
          - UCLuster-Too-qualifier-pictures.pptx shows each slide as one picture, identical everywhere but not editable.

          The web deck is the source. Edits made in PowerPoint do not reach the site."
